name: Vimmite V6 image
on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_approved:
        description: "Confirm the V6 physical acceptance matrix and build gate passed"
        required: true
        default: false
        type: boolean
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Vimmite V6 image
    if: github.event_name == 'pull_request' || inputs.release_approved
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.12
        with:
          recipe: vimmite.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          push: ${{ github.event_name == 'workflow_dispatch' }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
