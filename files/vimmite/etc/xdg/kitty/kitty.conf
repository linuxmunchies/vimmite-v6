# Vimmite Kitty defaults. A user's ~/.config/kitty/kitty.conf can override
# any value without modifying the image.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

window_padding_width 12
placement_strategy center
remember_window_size yes
initial_window_width  110c
initial_window_height 32c
confirm_os_window_close 0

background            #111218
foreground            #ebecef
cursor                 #f6c453
cursor_text_color      #111218
selection_background  #6366f1
selection_foreground  #ffffff
url_color              #818cf8
active_border_color    #6366f1
inactive_border_color  #2d2e38
bell_border_color      #f6c453

color0  #18191f
color1  #ef4444
color2  #34d399
color3  #f6c453
color4  #6366f1
color5  #a78bfa
color6  #38bdf8
color7  #d6d7df
color8  #686a78
color9  #fb7185
color10 #6ee7b7
color11 #ffe08a
color12 #818cf8
color13 #c4b5fd
color14 #7dd3fc
color15 #ffffff

tab_bar_style powerline
tab_powerline_style slanted
active_tab_background   #6366f1
active_tab_foreground   #ffffff
inactive_tab_background #24252d
inactive_tab_foreground #9a9caa
wayland_titlebar_color  background
