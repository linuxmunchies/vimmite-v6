pulse.rules = [
  {
    matches = [
      { application.process.binary = "chrome" }
      { application.process.binary = "chromium" }
      { application.name = "~Chromium.*" }
      { application.process.binary = "Discord" }
      # Equibop's Flatpak currently launches /app/bin/equibop/equibop. Keep
      # the legacy Vesktop identities until a live call confirms every
      # PipeWire-Pulse property emitted by the replacement application.
      { application.process.binary = "equibop" }
      { application.process.binary = "equibop.bin" }
      { application.name = "equibop" }
      { application.name = "Equibop" }
      { application.process.binary = "vesktop.bin" }
      { application.name = "vesktop" }
      { application.process.binary = "teams" }
      { application.process.binary = "skypeforlinux" }
      { application.process.binary = "zoom" }
    ]
    actions = {
      quirks = [ block-source-volume ]
    }
  }
]
