---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: vimmite-v6-kinoite
description: "Vimmite V6: portable AMD/Intel KDE Atomic image for gaming and workstation use."

base-image: ghcr.io/ublue-os/kinoite-main
image-version: 44

modules:
  - from-file: modules/hardware.yml
  - from-file: modules/packages.yml
  - from-file: modules/ivpn.yml
  - from-file: modules/gaming.yml
  - from-file: modules/virtualization.yml
  - from-file: modules/configuration.yml
  - from-file: modules/flatpaks.yml
  - type: brew
    nofile-limits: true
    brew-analytics: false
  # Rebuild after all image files are present so the hid_apple options are
  # available if the driver is loaded during early boot.
  - type: initramfs
  - type: signing
