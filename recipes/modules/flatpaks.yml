---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json

type: default-flatpaks
configurations:
  - notify: true
    scope: system
    repo:
      title: Flathub (system)
    install:
      # Browsers and application discovery
      - com.brave.Browser
      - io.github.ungoogled_software.ungoogled_chromium
      - io.github.kolunmi.Bazaar

      # Productivity and communication
      - com.bitwarden.desktop
      - org.onlyoffice.desktopeditors
      - md.obsidian.Obsidian
      - dev.zed.Zed
      - org.telegram.desktop
      - org.equicord.equibop
      - org.signal.Signal
      - re.fossplant.songrec

      # Media and creation
      - org.gimp.GIMP
      - org.kde.gwenview
      - com.obsproject.Studio
      - org.kde.kdenlive
      - org.blender.Blender
      - org.kde.krita
      - org.jeffvli.feishin
      - net.mediaarea.MediaInfo

      # Gaming
      - com.vysp3r.ProtonPlus
      - com.usebottles.bottles

      # System utilities and virtualization
      - org.virt_manager.virt-manager
      - io.github.flattool.Warehouse
      - org.localsend.localsend_app
      - com.github.tchx84.Flatseal
      - net.nokyan.Resources
      - io.github.dimtpap.coppwr
      - com.rustdesk.RustDesk
      - it.mijorus.gearlever
      - com.github.zocker_160.SyncThingy
      - org.filezillaproject.Filezilla
      - com.vscodium.codium

  # Keep a user Flathub remote for optional applications without showing a
  # misleading "installed 0 user Flatpaks" notification after every login.
  - notify: false
    scope: user
    repo:
      title: Flathub (user)
