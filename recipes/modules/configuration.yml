---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: files
    files:
      - source: vimmite
        destination: /

  - type: script
    scripts:
      - install-nerd-fonts.sh
      - install-zimfw.sh

  - type: justfiles

  # The Brew module installs Homebrew itself; this service declaratively
  # reconciles the small list of image-managed formulae after that setup.
  - type: systemd
    system:
      enabled:
        - vimmite-brew-packages.service
    user:
      enabled:
        - vimmite-first-login.service
