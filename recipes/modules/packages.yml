---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json

type: dnf
install:
  packages:
    # Shell, editors, and command-line utilities
    - zsh
    - git
    - vim-enhanced
    - neovim
    - kitty
    - inxi
    - fastfetch
    - unzip
    - rclone
    - tmux
    - tree
    - lsd
    - btop
    - restic
    
    # Storage, health, and hardware diagnostics
    - rsync
    - smartmontools
    - nvme-cli
    - lm_sensors
    - fuse
    - fuse-libs

    # Media tools
    - vlc
    - mpv
    - mediainfo
    - mixxx
    - flac

    # Container tooling; Distrobox and Podman are already supplied by the base
    - podman-compose
